map $uri $artifact_csp {
  default "";
  ~^/_artifacts/(?<artifact_site_id>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/ "default-src $scheme://$http_host/_artifacts/$artifact_site_id/ data: blob:; script-src $scheme://$http_host/_artifacts/$artifact_site_id/ 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src $scheme://$http_host/_artifacts/$artifact_site_id/ 'unsafe-inline' data: blob:";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /_indexes/ {
    alias /usr/share/nginx/storage/_indexes/;
    autoindex on;
    autoindex_exact_size off;
    add_header Cache-Control "no-store";
  }

  location ^~ /_artifacts/ {
    alias /usr/share/nginx/storage/_artifacts/;
    add_header Content-Security-Policy $artifact_csp always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

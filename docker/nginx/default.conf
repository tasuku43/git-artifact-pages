server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /_indexes/ {
    alias /usr/share/nginx/storage/_indexes/;
    autoindex on;
    autoindex_exact_size off;
    add_header Cache-Control "no-store";
  }

  location ^~ /_artifacts/ {
    alias /usr/share/nginx/storage/_artifacts/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
